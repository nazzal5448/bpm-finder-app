plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.nazzal5448'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.github.nazzal5448'
            artifactId = 'bpm-finder-app'
            version = '1.0.0'
        }
    }
}
