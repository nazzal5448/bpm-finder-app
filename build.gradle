plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.nazzal5448'
version = '1.0.0'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['java-bpm-finder/src/main/java']
        }
    }
}

task sourcesJar(type: Jar) {
    from sourceSets.main.allJava
    classifier = 'sources'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.github.nazzal5448'
            artifactId = 'bpm-finder-app'
            version = '1.0.0'
            artifact sourcesJar
        }
    }
}
